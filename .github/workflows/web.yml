name: Build web apps

on:
  push:
    branches: ["**"]
    paths: ["web/**", ".github/workflows/web.yml", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["web/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/recorder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/recorder/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test (record a real video in Chromium)
        run: npm test
      - name: Upload screenshots and test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-test-results
          path: web/recorder/test-results
          if-no-files-found: ignore
