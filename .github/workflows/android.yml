name: Build APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if secrets are set)
        env:
          HH_KEYSTORE_BASE64: ${{ secrets.HH_KEYSTORE_BASE64 }}
        if: env.HH_KEYSTORE_BASE64 != ''
        run: |
          echo "$HH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and test all apps
        env:
          HH_VERSION_CODE: ${{ github.run_number }}
          HH_KEYSTORE_PASSWORD: ${{ secrets.HH_KEYSTORE_PASSWORD }}
          HH_KEY_ALIAS: ${{ secrets.HH_KEY_ALIAS }}
          HH_KEY_PASSWORD: ${{ secrets.HH_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          for apk in apps/*/build/outputs/apk/*/*.apk; do
            [ -e "$apk" ] || continue
            app=$(echo "$apk" | cut -d/ -f2)
            cp "$apk" "dist/${app}-$(basename "$apk")"
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: ignore
