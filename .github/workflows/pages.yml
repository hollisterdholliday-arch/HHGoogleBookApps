# Publishes the web apps to GitHub Pages from main:
#   https://<owner>.github.io/<repo>/            app list
#   https://<owner>.github.io/<repo>/recorder/   the recorder
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/recorder/package-lock.json
      - name: Build recorder
        working-directory: web/recorder
        run: npm ci && npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp web/index.html site/
          cp -r web/recorder/dist site/recorder
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
